<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SajiloShram{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
    header { background: #1b5e20; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    header a, header button { color: #fff; background: none; border: none; font-size: 16px; cursor: pointer; text-decoration: none; }
    nav { display: flex; align-items: center; gap: 14px; }
    nav form { margin: 0; }
    main { max-width: 480px; margin: 20px auto; padding: 0 16px; }
    .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    input, select, textarea { width: 100%; padding: 12px; margin: 6px 0 14px; font-size: 16px; box-sizing: border-box; }
    input[type="checkbox"] { width: auto; margin: 0 8px 0 0; padding: 0; }
    .btn { width: 100%; padding: 14px; background: #1b5e20; color: #fff; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
    .errorlist { color: #c62828; padding-left: 18px; margin: 0; }
    .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 14px; background: #e3f2fd; color: #0d47a1; }
    .message.success { background: #e8f5e9; color: #1b5e20; }
    .message.error { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <header>
    <strong>SajiloShram</strong>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'job_list' %}">My jobs</a>
        {% if user.role == 'employer' %}
          <a href="{% url 'worker_list' %}">Find workers</a>
        {% endif %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Logout</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% if messages %}
      {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
