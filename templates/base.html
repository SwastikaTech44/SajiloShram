<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SajiloShram{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
    header { background: #1b5e20; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    header a, header button { color: #fff; background: none; border: none; font-size: 16px; cursor: pointer; text-decoration: none; }
    main { max-width: 480px; margin: 20px auto; padding: 0 16px; }
    .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    input, select { width: 100%; padding: 12px; margin: 6px 0 14px; font-size: 16px; box-sizing: border-box; }
    .btn { width: 100%; padding: 14px; background: #1b5e20; color: #fff; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
    .errorlist { color: #c62828; padding-left: 18px; margin: 0; }
  </style>
</head>
<body>
  <header>
    <strong>SajiloShram</strong>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
