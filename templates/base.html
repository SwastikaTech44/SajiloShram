<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SajiloShram{% endblock %}</title>
  <style>
    :root {
      --brand: #1b5e20;
      --page-bg: #f4f6f8;
    }
    body { font-family: Arial, sans-serif; margin: 0; background: var(--page-bg); }
    header { background: var(--brand); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: relative; }
    header a, header button { color: #fff; background: none; border: none; font-size: 16px; cursor: pointer; text-decoration: none; }
    nav { display: flex; align-items: center; gap: 14px; }
    nav form { margin: 0; }
    .nav-toggle { display: none; font-size: 26px; line-height: 1; padding: 4px 8px; }

    @media (max-width: 600px) {
      .nav-toggle { display: block; }
      nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 0; padding: 0 16px 8px; background: var(--brand); box-shadow: 0 6px 10px rgba(0,0,0,.25); z-index: 20; }
      nav.open { display: flex; }
      nav a, nav button { display: block; width: 100%; text-align: left; padding: 14px 0; border-top: 1px solid rgba(255,255,255,.2); }
    }

    main { max-width: 480px; margin: 20px auto; padding: 0 16px; }
    .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    input, select, textarea { width: 100%; padding: 12px; margin: 6px 0 14px; font-size: 16px; box-sizing: border-box; }
    input[type="checkbox"] { width: auto; margin: 0 8px 0 0; padding: 0; }
    .btn { width: 100%; padding: 14px; background: var(--brand); color: #fff; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
    .errorlist { color: #c62828; padding-left: 18px; margin: 0; }
    .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 14px; background: #e3f2fd; color: #0d47a1; }
    .message.success { background: #e8f5e9; color: #1b5e20; }
    .message.error { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <header>
    <strong>SajiloShram</strong>
    {% if user.is_authenticated %}
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <nav id="main-nav">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'job_list' %}">My jobs</a>
        {% if user.role == 'employer' %}
          <a href="{% url 'worker_list' %}">Find workers</a>
        {% endif %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Logout</button>
        </form>
      </nav>
    {% endif %}
  </header>
  <main>
    {% if messages %}
      {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    var toggle = document.getElementById("nav-toggle");
    var menu = document.getElementById("main-nav");
    if (toggle && menu) {
      toggle.addEventListener("click", function () {
        var isOpen = menu.classList.toggle("open");
        toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
      });
    }
  </script>
</body>
</html>
