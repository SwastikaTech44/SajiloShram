{% extends 'base.html' %}
{% block title %}Hire a worker{% endblock %}
{% block content %}
<div class="card">
  <h2>Hire {{ profile.user.get_full_name|default:profile.user.username }}</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send hire request</button>
  </form>
</div>
{% endblock %}
