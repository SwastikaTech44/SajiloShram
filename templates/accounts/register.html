{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card">
  <h2>Create account</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
